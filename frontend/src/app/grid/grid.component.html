<div class="grid">
  <div class="row" *ngFor="let row of cells; let r = index">
    <div class="cell" *ngFor="let cell of row; let c = index" [class.flash]="cell.flash">
      <div class="cell-label">R{{ r + 1 }} · C{{ c + 1 }}</div>
      <div class="cell-value">{{ cell.value | number: '1.2-2' }}</div>
    </div>
  </div>
</div>
