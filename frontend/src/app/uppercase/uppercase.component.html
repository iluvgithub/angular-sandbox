<div class="page">
  <h1>Uppercase Converter</h1>

  <div class="panel">
    <input
      type="text"
      class="textbox"
      placeholder="Type something..."
      [(ngModel)]="inputText"
      (keyup.enter)="onConvertClick()"
    />

    <button class="convert-btn" [disabled]="loading" (click)="onConvertClick()">
      {{ loading ? 'Converting...' : 'Convert to uppercase' }}
    </button>

    <label class="result-label">{{ displayText }}</label>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>
</div>
